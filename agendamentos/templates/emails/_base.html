<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{ assunto }}</title>
</head>
{# E-mail: so tabelas e estilos inline (Gmail, Outlook e iPhone ignoram CSS externo) #}
<body style="margin:0;padding:0;background-color:#0a0a0a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0a0a0a" style="background-color:#0a0a0a;">
<tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
        <tr><td style="padding:0 4px 20px;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;letter-spacing:-1px;color:#ededed;">
            barber<span style="color:#e2a053;">house</span>
        </td></tr>
        <tr><td bgcolor="#161616" style="background-color:#161616;border:1px solid #2a2a2a;border-radius:20px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;color:#ededed;">
            {% block conteudo %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8f8f8f;">
            {% block rodape %}Você recebeu este e-mail porque tem uma conta na BarberHouse. Não responda: esta caixa não é lida.{% endblock %}
        </td></tr>
    </table>
</td></tr>
</table>
</body>
</html>
